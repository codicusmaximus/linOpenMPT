name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          # jackd2 runs the JACK playback test (a private server, dummy driver).
          # dpf-plugins-vst has the Linux VST2 plugins the VST tests load, and
          # Xvfb runs the one that embeds a plugin's editor.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config g++ \
            qt6-base-dev \
            libjack-jackd2-dev jackd2 libpulse-dev libasound2-dev libdbus-1-dev \
            zlib1g-dev libmpg123-dev libogg-dev libvorbis-dev libflac-dev \
            libopus-dev libopusfile-dev libopusenc-dev libmp3lame-dev liblhasa-dev \
            dpf-plugins-vst xvfb xauth
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
