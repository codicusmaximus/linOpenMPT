name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          # wine has the wine command (wine64 alone has not); i386: Wine's
          # 32-bit part, for the 32-bit bridge's tests.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # jackd2 runs the JACK playback test (a private server, dummy driver).
          # dpf-plugins-vst has the Linux VST2 plugins the VST tests load, and
          # Xvfb runs the one that embeds a plugin's editor. MinGW builds the
          # Wine bridge for Windows plugins and its test plugin, which Wine
          # runs; xdotool clicks the bridged editor; libxcb1-dev places it.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config g++ \
            qt6-base-dev \
            libjack-jackd2-dev jackd2 libpulse-dev libasound2-dev libdbus-1-dev \
            zlib1g-dev libmpg123-dev libogg-dev libvorbis-dev libflac-dev \
            libopus-dev libopusfile-dev libopusenc-dev libmp3lame-dev liblhasa-dev \
            dpf-plugins-vst xvfb xauth \
            g++-mingw-w64-x86-64 wine64 xdotool libxcb1-dev \
            g++-mingw-w64-i686 wine wine32:i386
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # mfc-qt builds and tests without the rest of the repository, as
      # another application would use it.
      - name: Build and test mfc-qt alone
        run: |
          cmake -S mfc-qt -B build-mfcqt -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-mfcqt
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-mfcqt --output-on-failure
